[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "csscss-revived"
version = "0.1.0"
description = "Find CSS rulesets that repeat the same declarations"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.scripts]
csscss = "csscss_cli.cli:main"

[tool.setuptools]
packages = ["csscss_cli"]
