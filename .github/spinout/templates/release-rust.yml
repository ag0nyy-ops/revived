name: release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: tag of the release to build for
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - run: rustup target add ${{ matrix.target }}
      - run: cargo test --release __LOCKED__
      - run: cargo build --release __LOCKED__ --target ${{ matrix.target }}
      - name: package
        run: |
          name="__BIN__-$TAG-${{ matrix.target }}"
          mkdir -p "dist/$name"
          ext=""; [ "${{ runner.os }}" = "Windows" ] && ext=".exe"
          cp "target/${{ matrix.target }}/release/__BIN__$ext" "dist/$name/"
          cp README.md LICENSE "dist/$name/"
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then 7z a -bd "$name.zip" "$name" > /dev/null; else tar czf "$name.tar.gz" "$name"; fi
          rm -rf "$name"
      - run: gh release upload "$TAG" dist/* --clobber
