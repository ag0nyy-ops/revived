name: release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: tag of the release to build for
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: __INSTALL__
      - run: npm test
      - run: mkdir -p dist && npm pack --pack-destination dist
      - run: gh release upload "$TAG" dist/* --clobber
