[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "eml2html"
version = "0.1.0"
description = "Convert .eml email files to standalone HTML"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.scripts]
eml2html = "eml2html.cli:main"

[tool.setuptools]
packages = ["eml2html"]
