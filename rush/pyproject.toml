[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rush-revived"
version = "0.1.0"
description = "Run named bash snippets from a rushfile.yml"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.scripts]
rush = "rush_cli.cli:main"

[tool.setuptools]
packages = ["rush_cli"]
