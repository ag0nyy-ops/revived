name: release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: tag of the release to build for
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip build
      - name: test
        run: |
          python -m pip install .
          if grep -rqs pytest tests; then python -m pip install pytest; fi
          __TESTCMD__
      - run: python -m build --outdir dist
      - name: single-file app
        run: |
          python -m pip install . --target build/app
          python -m zipapp build/app -m "__ENTRY__" -p "/usr/bin/env python3" -o "dist/__BIN__-$TAG.pyz"
          python "dist/__BIN__-$TAG.pyz" --help > /dev/null
      - run: gh release upload "$TAG" dist/* --clobber
